[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tmaponline"
version = "0.1.0"
description = "tMapOnline browser world map, local telemetry service, and tModLoader server mod"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0,<7", "Pillow>=10,<12"]

[project.optional-dependencies]
dev = ["types-PyYAML>=6.0", "types-Pillow>=10,<12"]

[project.scripts]
tmaponline = "tmaponline.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tmaponline*"]

[tool.setuptools.package-data]
tmaponline = ["web/**/*.html", "web/**/*.css", "web/**/*.js", "web/**/*.ts", "web/**/*.scss", "sprite_renderer/LICENSE-lzx.txt"]

[tool.pyright]
include = ["tmaponline", "tests", "tools"]
exclude = ["**/__pycache__", "**/node_modules", "**/.venv", "dist", "tmodloader"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.9"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
