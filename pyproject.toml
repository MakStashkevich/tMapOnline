[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terraria-world-viewer"
version = "0.1.0"
description = "Modular local Terraria world viewer, telemetry service, and tModLoader server mod"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["types-PyYAML>=6.0"]

[project.scripts]
terraria-viewer = "terraria_viewer.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["terraria_viewer*"]

[tool.setuptools.package-data]
terraria_viewer = ["web/**/*.html", "web/**/*.css", "web/**/*.js", "web/**/*.ts", "web/**/*.scss", "sprite_renderer/java/*.java"]

[tool.pyright]
include = ["terraria_viewer", "tests", "tools"]
exclude = ["**/__pycache__", "**/node_modules", "**/.venv", "dist", "tmodloader"]
pythonVersion = "3.9"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
