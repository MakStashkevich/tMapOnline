<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>Terraria — Карта мира</title>
    <link rel="stylesheet" href="/assets/world-map.css" />
    <link rel="stylesheet" href="/assets/app-shell.css" />
  </head>
  <body>
    <main id="map-pane" class="map-pane" aria-label="Карта мира">
      <div
        id="viewport"
        class="map-viewport"
        aria-label="Карта мира. Жесты меняют масштаб и положение карты."
      >
        <div class="map-stage" id="stage">
          <div id="chunk-layer"></div>
          <svg id="paths" preserveAspectRatio="none"><g id="route-layer"></g></svg>
          <div class="map-ping-layer" id="pings" aria-live="off"></div>
          <div class="pylon-layer" id="pylons"></div>
          <div class="spawn-layer" id="spawn"></div>
          <div class="entity-layer" id="entities"></div>
          <div class="coin-layer" id="coins"></div>
          <div class="death-layer" id="deaths"></div>
          <div class="markers" id="markers"></div>
          <div id="map-edge-bands" aria-hidden="true"></div>
        </div>
        <div class="status" id="status" hidden></div>
      </div>
      <div class="map-menu-tooltip" id="map-menu-tooltip" role="tooltip" hidden></div>
      <div id="map-tooltip" role="tooltip" hidden><strong></strong><span></span></div>

      <div class="map-action-menu" id="map-action-menu">
        <div class="map-submenu pixel-button-column" id="map-submenu" hidden></div>
        <div class="map-menu-column">
          <div
            class="map-category-list pixel-button-column"
            id="map-category-list"
            role="toolbar"
            aria-label="Инструменты карты"
          ></div>
          <div class="map-menu-settings">
            <button
              class="pixel-button menu-main-button"
              id="map-menu-toggle"
              type="button"
              aria-label="Настройки карты"
              aria-expanded="false"
            >
              <img
                class="pixel-art-icon"
                src="/assets/map-icons/rabbit.png"
                alt=""
                aria-hidden="true"
              />
            </button>
          </div>
        </div>
      </div>

      <div class="pixel-zoom-controls" id="zoom-tools" aria-label="Масштаб карты">
        <button
          class="pixel-button pixel-icon-button"
          id="zoom-in"
          type="button"
          aria-label="Увеличить карту"
        >
          <img src="/assets/ui/larchrow/icons/icon_plus.png" alt="" aria-hidden="true" />
        </button>
        <div id="zoom-level">100%</div>
        <button
          class="pixel-button pixel-icon-button"
          id="zoom-out"
          type="button"
          aria-label="Уменьшить карту"
        >
          <img src="/assets/ui/larchrow/icons/icon_minus.png" alt="" aria-hidden="true" />
        </button>
      </div>
      <div class="map-utility-group">
        <button
          class="pixel-button pixel-text-button"
          id="fit"
          type="button"
          title="Показать весь мир"
        >
          <img src="/assets/ui/larchrow/icons/icon_map.png" alt="" aria-hidden="true" />
          <span>Мир</span>
        </button>
        <button
          class="pixel-button"
          id="download-map"
          type="button"
          aria-label="Скачать PNG карты"
          title="Скачать PNG карты"
        >
          <img src="/assets/ui/larchrow/icons/icon_save.png" alt="" aria-hidden="true" />
          <span>PNG</span>
        </button>
      </div>
    </main>

    <dialog class="pixel-modal" id="pixel-modal" aria-labelledby="pixel-modal-title">
      <div class="pixel-modal-frame">
        <header class="pixel-modal-header">
          <h2 id="pixel-modal-title"></h2>
          <button
            class="pixel-button pixel-icon-button pixel-modal-close"
            type="button"
            aria-label="Закрыть окно"
          >
            <img src="/assets/ui/larchrow/icons/icon_close.png" alt="" aria-hidden="true" />
          </button>
        </header>
        <div class="pixel-modal-content" id="pixel-modal-content" tabindex="0">
          <section class="pixel-player-layer-panel" id="pixel-player-layer-panel" hidden>
            <h3 class="pixel-section-heading">Исследование и маршруты</h3>
            <nav class="players map-layers" id="players" aria-label="Слои игроков и маршруты"></nav>
          </section>
          <div class="pixel-section-content" id="pixel-section-content"></div>
        </div>
      </div>
    </dialog>
    <div id="app-tooltip" role="tooltip" hidden></div>
    <script type="module" src="/assets/app-shell.js"></script>
    <script type="module" src="/assets/world-map.js"></script>
  </body>
</html>
